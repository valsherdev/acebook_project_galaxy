<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8"/>
    <title>Post</title>
    <link rel="stylesheet" href="/main.css" />
    <link rel="stylesheet" href="/theme.css" />
</head>
<body>
<div layout:fragment="content">

    <div class="post-box">
        <a class="back-link" th:href="@{/posts}">&larr; Back to feed </a>

        <div class="post-author-container">
            <a th:if="${post.user != null}"
               th:href="@{'/profile/' + ${post.user.id}}">
                <img class="profile-pic-placeholder"
                     th:src="${profile != null and profile.profilePicture != null}
                         ? @{/profile/{userId}/image(userId=${profile.user.id})}
                         : 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsYYYmIOuieWvw2LUapfA7Catq3e-NyzpWMPjVoZ32pQ&s=10'"
                     alt="Profile Picture" />
            </a>
            <div class="post-meta">
                <p class="post-author-text">
                    <a th:if="${post.user != null}"
                       th:href="@{'/profile/' + ${post.user.id}}"
                       th:text="${post.user.name}">
                        Name
                    </a>
                    <strong th:if="${post.user == null}">Guest</strong>
                </p>
                <span class="post-timestamp" th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy, HH:mm')}"></span>
            </div>

            <div th:if="${post.user != null and post.user.id != currentUserId}" class="post-friend-action">
                <form th:action="@{/friends/add}" method="post"
                      th:if="${!currentUserFriendIds.contains(post.user.id) and !currentUserPendingIds.contains(post.user.id)}">
                    <input type="hidden" name="friendId" th:value="${post.user.id}"/>
                    <input type="hidden" name="currentUserId" th:value="${currentUserId}"/>
                    <button class="add-friend-btn" type="submit">Add Friend</button>
                </form>
                <span class="friends-label" th:if="${currentUserFriendIds.contains(post.user.id)}">Friends</span>
                <span class="pending-label" th:if="${currentUserPendingIds.contains(post.user.id)}">Request sent</span>
            </div>
        </div>
        <p th:text="${post.content}"></p>


        <div th:class="${post.convertedImages.size() == 1} ? 'image-grid single-image' : 'image-grid'"
             th:if="${post.images != null and !post.images.isEmpty()}">
            <div th:each="image, position : ${post.convertedImages}">
                <input type="checkbox" th:id="${'img-toggle-' + post.id + '-' + position.index}" class="expand-image" />

                <label th:for="${'img-toggle-' + post.id + '-' + position.index}" class="image-card">
                    <img th:src="@{'/posts/' + ${post.id} + '/images/' + ${position.index}}" alt="Post Image" class="grid-image" />
                </label>
            </div>
        </div>

        <div class="like-reload" th:id="${'post-' + post.id}">
            <form th:action="@{'/posts/' + ${post.id} + '/likes'}" method="post">
                <button type="submit">❤️</button>
                <span th:text="${post.likes.size()} + ' likes'"></span>
                <span th:if="${post.likes.size()} != 0">
                        | Liked by:
                        <th:block th:each="like, likeStat : ${post.likes}" th:if="${likeStat.index < 2}">
                            <a th:href="@{'/profile/' + ${like.user.id}}" th:text="${like.user.getName()}"></a>
                            <span th:if="${likeStat.index == 0 and post.likes.size() == 2}"> and </span>
                            <span th:if="${likeStat.index == 0 and post.likes.size() > 2}">, </span>
                            <span th:if="${likeStat.index == 1 and post.likes.size() > 2}"> and </span>
                        </th:block>
                        <details class="likes-dropdown" th:if="${post.likes.size() > 2}">
                            <summary class="likes-summary" th:text="${(post.likes.size() - 2) + ' other(s)'}"></summary>
                            <ul class="likes-list">
                                <li th:each="like, likeStat : ${post.likes}" th:if="${likeStat.index >= 2}">
                                    <a th:href="@{'/profile/' + ${like.user.id}}" th:text="${like.user.getName()}"></a>
                                </li>
                            </ul>
                        </details>
                </span>
            </form>
        </div>

        <h4>Comments</h4>
        <div th:each="comment : ${post.comments}">
            <a th:if="${comment.user != null}"
               th:href="@{'/profile/' + ${comment.user.id}}"
               th:text="${comment.user.name}">
                Name
            </a>
            <strong th:if="${comment.user == null}">Guest</strong>
            <span th:text="': ' + ${comment.content}"></span>
            <span th:text="${#temporals.format(comment.createdAt, 'dd MMM, HH:mm')}"></span>
        </div>

        <form class="comment-form" th:action="@{'/posts/' + ${post.id} + '/comments'}" method="post">
            <input type="text" name="content" placeholder="Write a comment..." required/>
            <button type="submit">Comment</button>
        </form>
    </div>
</div>
</body>
</html>

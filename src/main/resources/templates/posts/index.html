<!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
          xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
          layout:decorate="~{layout}">
    <head lang="en">
        <meta charset="UTF-8"/>
        <title>Acebook</title>
        <link rel="stylesheet" href="/main.css" />
    </head>
    <body>

    <div layout:fragment="content">

        <h1>Posts Feed</h1>

        <form class="post-form" action="#" th:action="@{/posts}" th:object="${post}" method="post">
            <div class="profile-pic-placeholder">👤</div>
                <input type="text" th:field="*{content}" placeholder="What's on your mind?"/>
            <div class="post-form-actions">
                <input type="submit" value="Submit" />
                <input type="reset" value="Reset" />
            </div>
        </form>

            <ul>
                <li class="post-box" th:each="post: ${posts}">
                    <p>
                        <span th:text="${post.user != null ? post.user.username : 'Unknown'}"></span>:
                        <span th:text="${post.content}"></span>
                        <span th:text="${post.createdAt}"></span>
                    </p>
                </li>
            </ul>
    </div>
    </body>
</html>

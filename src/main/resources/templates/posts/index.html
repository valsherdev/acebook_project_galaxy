<!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
          xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
          layout:decorate="~{layout}">
    <head lang="en">
        <meta charset="UTF-8"/>
        <title>Acebook</title>
        <link rel="stylesheet" href="/main.css" />
    </head>
    <body>

    <div layout:fragment="content">

        <h1>Posts Feed</h1>

        <form class="post-form" action="#" th:action="@{/posts}" th:object="${post}" method="post" enctype="multipart/form-data">

            <img class="profile-pic-placeholder"
                 th:src="${profile != null and profile.profilePicture != null} ? 'data:image/jpeg;base64,' + ${profile.convertImageByteToString()} :
                 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsYYYmIOuieWvw2LUapfA7Catq3e-NyzpWMPjVoZ32pQ&s=10'"
                 alt="Profile Picture" />

            <input type="text" th:field="*{content}" placeholder="What's on your mind?"/>

            <label class="image-upload-icon">
                📷 <input type="file" name="imageFiles" multiple />
            </label>
            <div class="post-form-actions">
                    <input type="submit" value="Submit" />
                    <input type="reset" value="Reset" />
            </div>
        </form>

    <ul>

    <li class="post-box" th:each="post: ${posts}" th:with="profile=${post.user?.profile},
        hasFirstName=${profile != null and !#strings.isEmpty(profile.firstName)},
        hasLastName=${profile != null and !#strings.isEmpty(profile.lastName)}">
        <details class="post-menu">
            <summary class="dots-button">⋮</summary>

            <form th:if="${post.user != null and post.user.id == currentUserId}"
                  th:action="@{'/posts/' + ${post.id} + '/delete'}"
                  method="post">
                <button type="submit">Delete</button>
            </form>
        </details>

        <img class="profile-pic-placeholder"
             th:src="${profile != null and profile.profilePicture != null} ? 'data:image/jpeg;base64,' + ${profile.convertImageByteToString()} :
                 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsYYYmIOuieWvw2LUapfA7Catq3e-NyzpWMPjVoZ32pQ&s=10'"
             alt="Profile Picture" />

        <p>
            Posted by
            <a th:if="${hasFirstName} and ${hasLastName}"
               th:href="@{'/profile/' + ${post.user.id}}"
               th:text="${post.user.profile.firstName} + ' ' + ${post.user.profile.lastName}">First and Last name
            </a>

            <a th:unless="${hasFirstName} and ${hasLastName}"
                    th:href="@{'/profile/' + ${post.user.id}}"
                    th:text="${post.user.username}">Email
            </a>

            <strong th:if="${post.user == null}">Guest</strong>

        </p>

            <p th:text="${post.content}"></p>
            <span th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy, HH:mm')}"></span>

<!--     if only 1 image uploaded then will follow css class image-grid single-image otherwise if more than 1 image then will follow css clas image-grid -->
        <div th:class="${post.convertedImages.size() == 1} ? 'image-grid single-image' : 'image-grid'"
             th:if="${post.images != null and !post.images.isEmpty()}">
            <div th:each="image, position : ${post.convertedImages}">
                <input type="checkbox" th:id="${'img-toggle-' + post.id + '-' + position.index}" class="expand-image" />

                <label th:for="${'img-toggle-' + post.id + '-' + position.index}" class="image-card">
                    <img th:src="@{'data:image/jpeg;base64,' + ${image}}" alt="Post Image" class="grid-image" />
                </label>
            </div>
        </div>


        <div th:if="${post.user != null and post.user.id != currentUserId}">
            <form th:action="@{/friends/add}" method="post"
                  th:if="${!currentUserFriendIds.contains(post.user.id) and !currentUserPendingIds.contains(post.user.id)}">
                <input type="hidden" name="friendId" th:value="${post.user.id}"/>
                <input type="hidden" name="currentUserId" th:value="${currentUserId}"/>
                <button class="friend-btn" type="submit">Add Friend</button>
            </form>
            <span class="friends-label" th:if="${currentUserFriendIds.contains(post.user.id)}">Friends</span>
            <span class="pending-label" th:if="${currentUserPendingIds.contains(post.user.id)}">Request sent</span>
        </div>

        <form th:action="@{'/posts/' + ${post.id} + '/likes'}" method="post">
            <button type="submit">❤️</button>
            <span th:text="${post.likes.size()} + ' likes'"></span>
        </form>

        <div>
            <h4 th:text="'Comments (' + ${post.comments.size()} + ')'"></h4>

            <div th:each="comment, commentStat : ${post.comments}" th:if="${commentStat.index < 3}"
                 th:with="cProfile=${comment.user?.profile}, hasBothNames=${cProfile != null and !#strings.isEmpty(cProfile.firstName) and !#strings.isEmpty(cProfile.lastName)}">
                <span th:text="${hasBothNames ? cProfile.firstName + ' ' + cProfile.lastName + ': ' + comment.content
                      : comment.user.username + ': ' + comment.content}"
                ></span>

                <span th:text="${#temporals.format(comment.createdAt, 'dd MMM, HH:mm')}"></span>
            </div>
            <p th:if="${post.comments.size() > 3}">
                <a th:href="@{'/posts/' + ${post.id}}">View all <span th:text="${post.comments.size()}"></span> comments</a>
            </p>

            <form th:action="@{'/posts/' + ${post.id} + '/comments'}" method="post">
                <input type="text" name="content" placeholder="Leave a comment..." />
                <button type="submit">Comment</button>
            </form>
        </div>
    </li>
    </ul>
    </div>
    </body>
</html>

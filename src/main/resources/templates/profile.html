<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" lang="en">
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      xmlns:layout="https://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
    <head lang="en">
        <meta charset="UTF-8"/>
        <title>Profile</title>
        <link rel="stylesheet" href="/theme.css" />
    </head>

    <body>
        <div layout:fragment="content">

        <form action="#" th:action="@{/profile}" th:object="${profile}" method="post">
            First name: <input type="text" name="firstName" /><br/>
            Last name: <input type="text" name="lastName" /><br/>
            Current location: <input type="text" name="location" /><br/>
            Hometown: <input type="text" name="hometown" /><br/>
            About me: <input type="text" name="aboutMe" /><br/>
            <button type="submit">Save</button>
        </form>

        </div>

    </body>
</html>

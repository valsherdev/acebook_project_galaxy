<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>My Profile</title>
    <link rel="stylesheet" href="/theme.css" />
</head>

<body>
<div layout:fragment="content">
    <h2>My Profile</h2>
    <p><strong>Profile Picture:</strong></p>
    <img class="profile-pic-placeholder"
         th:src="${profile != null and profile.profilePicture != null} ? 'data:image/jpeg;base64,' + ${profile.convertImageByteToString()} :
                 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsYYYmIOuieWvw2LUapfA7Catq3e-NyzpWMPjVoZ32pQ&s=10'"
         alt="Profile Picture"
         style="max-width: 40px; height: auto;" />

    <p><strong>First name:</strong> <span th:text="${profile.firstName}">First</span></p>
    <p><strong>Last name:</strong> <span th:text="${profile.lastName}">Last</span></p>
    <p><strong>Current location:</strong> <span th:text="${profile.currentLocation}">Location</span></p>
    <p><strong>Hometown:</strong> <span th:text="${profile.hometown}">Hometown</span></p>
    <p><strong>About me:</strong> <span th:text="${profile.aboutMe}">About</span></p>

    <a th:href="@{/profile/edit}">Edit Profile</a>
</div>
</body>
</html>

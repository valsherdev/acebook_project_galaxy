<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head lang="en">
  <meta charset="UTF-8"/>
  <title>Friends</title>
  <link rel="stylesheet" href="/main.css" />
</head>
<body>

<div layout:fragment="content" class="friends-page">

  <h2>Friend requests</h2>
  <div class="friend-row" th:each="request : ${incomingRequests}">
    <a class="friend-username" th:href="@{'/profile/' + ${request.user.id}}" th:text="${request.user.name}"></a>
    <form th:action="@{'/friends/' + ${request.id} + '/accept'}" method="post" style="display:inline">
      <button type="submit" class="friend-btn">Accept</button>
    </form>
    <form th:action="@{'/friends/' + ${request.id} + '/decline'}" method="post" style="display:inline">
      <button type="submit" class="friend-decline">Decline</button>
    </form>
  </div>

  <h2>Requests you've sent</h2>
  <div class="friend-row" th:each="request : ${outgoingRequests}">
    <a class="friend-username" th:href="@{'/profile/' + ${request.friend.id}}" th:text="${request.friend.name}"></a>
    <span class="friend-pending">Pending</span>
  </div>

  <h2>Your friends</h2>
  <div th:if="${friends != null}">
    <div th:each="friend : ${friends}" class="friend-row" >
        <a class="friend-username" th:if="${friends != null}"
           th:href="@{'/profile/' + ${friend.id}}">
          <span th:text="${friend.name}"></span>
        </a>
        <form th:action="@{'/friends/' + ${friend.id} + '/delete'}" method="post">
          <button class="delete-friend-btn" type="submit">Remove Friend</button>
        </form>
    </div>
</div>

  <h2>People you may know</h2>
  <div class="friend-row" th:each="suggestion : ${suggestions}">
    <a class="friend-username" th:href="@{'/profile/' + ${suggestion.id}}" th:text="${suggestion.name}"></a>
    <form th:action="@{/friends/add}" method="post" style="display:inline">
      <input type="hidden" name="friendId" th:value="${suggestion.id}"/>
      <input type="hidden" name="currentUserId" th:value="${currentUserId}"/>
      <button class="add-friend-btn" type="submit">Add Friend</button>
    </form>
  </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <meta charset="UTF-8"/>
  <title th:text="'Chat with ' + ${otherUser.name}">Messages</title>
  <link rel="stylesheet" href="/main.css" />
</head>
<body>
<div layout:fragment="content">

  <a th:href="@{/messages}">&larr; Back to messages</a>
  <h2 th:text="'Conversation with ' + ${otherUser.name}"></h2>

  <div class="message-thread">
    <div th:each="message : ${messages}"
         th:class="${message.sender.id == currentUserId} ? 'message-bubble sent' : 'message-bubble received'">
      <span class="message-sender" th:text="${message.sender.name}"></span>
      <span th:text="${message.content}"></span>
      <span class="message-timestamp" th:text="${#temporals.format(message.createdAt, 'dd MMM, HH:mm')}"></span>
    </div>
    <p th:if="${messages.isEmpty()}">No messages yet - say hello!</p>
  </div>

  <form th:action="@{'/messages/' + ${otherUser.id}}" method="post">
    <input type="text" name="content" placeholder="Write a message..." required/>
    <button type="submit">Send</button>
  </form>

</div>
</body>
</html>

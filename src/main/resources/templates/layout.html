<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <link href="https://cdm.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/theme.css}" rel="stylesheet">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Acebook</title>
</head>

<div class="navbar-container">
    <nav class="navbar">
        <a class="navbar-brand" href="/posts">AceBook</a>

        <form class="search-box" action="/profiles/search" method="get">
            <input class="form-control mr-sm-2" type="search" name="query" placeholder="Search profiles" aria-label="Search">
            <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
        </form>

        <ul class="nav-links">
            <li><a href="/posts">Home</a></li>
            <li><a href="/friends">Friends</a></li>
            <li><a href="/profile">Profile</a></li>
            <li><a href="/notifications">
                Notifications
                <span th:if="${unreadNotificationCount > 0}" th:text="'(' + ${unreadNotificationCount} + ')'"></span>
            </a></li>
            <li><a href="/games/snake">🎮</a></li>

        </ul>

        <div class="sign-in-greeting" sec:authorize="isAuthenticated()" id="greeting">
            Signed in as: <span sec:authentication="principal.attributes['email']"></span>
            <a href="/logout">Logout</a>
        </div>

        </nav>



<!--                    <form class="form-inline my-2 my-lg-0">-->
<!--                        <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search">-->
<!--                        <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>-->
<!--                    </form>-->
    </nav>
</div>
<body>
    <div class="content-container">
        <section layout:fragment="content"></section>
    </div>
</body>
</html>
